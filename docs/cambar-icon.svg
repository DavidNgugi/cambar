<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CamBar app icon</title>
  <desc id="desc">A minimal camera lens mark sitting above a slim menu bar.</desc>

  <defs>
    <linearGradient id="background" x1="148" y1="84" x2="876" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C2D46"/>
      <stop offset="1" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="lens" x1="290" y1="236" x2="734" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#B8D3F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#050A12" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#background)"/>
  <rect x="32.5" y="32.5" width="959" height="959" rx="223.5" fill="none" stroke="#A9C8EC" stroke-opacity="0.18"/>

