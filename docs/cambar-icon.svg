    <path d="M271 340c0-37 30-67 67-67h93l48-61h66l48 61h93c37 0 67 30 67 67v203c0 37-30 67-67 67H338c-37 0-67-30-67-67V340Z" fill="url(#lens)"/>
    <circle cx="512" cy="438" r="119" fill="#15263D"/>
    <circle cx="512" cy="438" r="82" fill="#284967"/>
    <circle cx="512" cy="438" r="48" fill="#0B1422"/>
    <circle cx="478" cy="404" r="17" fill="#FFFFFF" fill-opacity="0.72"/>
    <circle cx="706" cy="337" r="16" fill="#E98B73"/>
  </g>

  <rect x="266" y="722" width="492" height="56" rx="28" fill="#F5F9FF"/>
  <rect x="304" y="742" width="116" height="16" rx="8" fill="#E98B73"/>
  <rect x="450" y="742" width="190" height="16" rx="8" fill="#B8D3F1"/>
  <circle cx="694" cy="750" r="8" fill="#E98B73"/>
