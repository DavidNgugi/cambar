name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing_temp.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build CamBar.app
        env:
          VERSION: ${{ github.ref_name }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          chmod +x build-app.sh scripts/*.sh
          ./build-app.sh

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dmg && mkdir -p dmg
          cp -R CamBar.app dmg/
          ln -s /Applications dmg/Applications
          printf '%s\n' \
            'CamBar is a menu-bar app.' \
            '' \
            '1. Drag CamBar to Applications.' \
            '2. First launch: open CamBar from Applications.' \
            '3. Look for the camera icon in the menu bar (top-right of the screen).' \
            > dmg/README.txt
          hdiutil create -volname "CamBar ${VERSION}" \
            -srcfolder "dmg" -ov -format UDZO \
            "CamBar-${VERSION}.dmg"
          ls -lh CamBar-*.dmg

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool submit "CamBar-${GITHUB_REF_NAME#v}.dmg" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "CamBar-${GITHUB_REF_NAME#v}.dmg"
          xcrun stapler validate "CamBar-${GITHUB_REF_NAME#v}.dmg"

      - name: Publish release with notes
        uses: softprops/action-gh-release@v2
        with:
          files: CamBar-*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
