name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CamBar.app
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x build-app.sh scripts/*.sh
          ./build-app.sh

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dmg && mkdir -p dmg
          cp -R CamBar.app dmg/
          ln -s /Applications dmg/Applications
          printf '%s\n' \
            'CamBar is a menu-bar app.' \
            '' \
            '1. Drag CamBar to Applications.' \
            '2. First launch: right-click CamBar -> Open (or run: xattr -dr com.apple.quarantine /Applications/CamBar.app).' \
            '3. Look for the camera icon in the menu bar (top-right of the screen).' \
            > dmg/README.txt
          hdiutil create -volname "CamBar ${VERSION}" \
            -srcfolder "dmg" -ov -format UDZO \
            "CamBar-${VERSION}.dmg"
          ls -lh CamBar-*.dmg

      - name: Publish release with notes
        uses: softprops/action-gh-release@v2
        with:
          files: CamBar-*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
